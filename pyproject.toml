[project]
name = "jg.beak"
version = "0.0"
description = "Analyzes text, returns tags"
readme = "README.md"
authors = [{ name = "Honza Javorek", email = "honza@junior.guru" }]
license = { text = "AGPL-3.0-only" }
requires-python = ">=3.13,<3.14"
dependencies = [
    "click>=8.5.0",
    "pydantic>=2",
]

[project.urls]
homepage = "https://junior.guru/"
repository = "https://github.com/juniorguru/beak/"

[project.scripts]
beak = "jg.beak.core:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-ruff>=0.5",
    "ruff>=0.16.7",
]

[tool.pytest.ini_options]
python_files = "test_*.py"
testpaths = "tests"
addopts = "--import-mode=importlib --ff --ruff --ruff-format"

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.isort]
combine-as-imports = true
lines-after-imports = 2

[build-system]
requires = ["uv_build>=0.8.11,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "jg.beak"
